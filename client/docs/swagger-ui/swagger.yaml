  /panacea/did/v2/dids/{did_base64}:
    get:
      summary: DID returns a DID Document with a sequence number.
      operationId: DID
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              did_document_with_seq:
                type: object
                properties:
                  document:
                    type: object
                    properties:
                      contexts:
                        type: object
                        properties:
                          values:
                            type: array
                            items:
                              type: string
                        description: >-
                          Strings defines a JSON-LD string array format which is
                          marshalled to a single

                          string if the array length is 1.
                      id:
                        type: string
                      controller:
                        type: object
                        properties:
                          values:
                            type: array
                            items:
                              type: string
                        description: >-
                          Strings defines a JSON-LD string array format which is
                          marshalled to a single

                          string if the array length is 1.
                      verification_methods:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            type:
                              type: string
                            controller:
                              type: string
                            public_key_base58:
                              type: string
                          title: VerificationMethod defines a W3C verification method
                      authentications:
                        type: array
                        items:
                          type: object
                          properties:
                            verification_method_id:
                              type: string
                            verification_method:
                              type: object
                              properties:
                                id:
                                  type: string
                                type:
                                  type: string
                                controller:
                                  type: string
                                public_key_base58:
                                  type: string
                              title: >-
                                VerificationMethod defines a W3C verification
                                method
                          title: >-
                            VerificationRelationship defines a W3C verification
                            relationship
                        title: |-
                          TODO: the repeated gogoproto.customtype has an issue:
                          https://github.com/gogo/protobuf/issues/478
                      assertion_methods:
                        type: array
                        items:
                          type: object
                          properties:
                            verification_method_id:
                              type: string
                            verification_method:
                              type: object
                              properties:
                                id:
                                  type: string
                                type:
                                  type: string
                                controller:
                                  type: string
                                public_key_base58:
                                  type: string
                              title: >-
                                VerificationMethod defines a W3C verification
                                method
                          title: >-
                            VerificationRelationship defines a W3C verification
                            relationship
                      key_agreements:
                        type: array
                        items:
                          type: object
                          properties:
                            verification_method_id:
                              type: string
                            verification_method:
                              type: object
                              properties:
                                id:
                                  type: string
                                type:
                                  type: string
                                controller:
                                  type: string
                                public_key_base58:
                                  type: string
                              title: >-
                                VerificationMethod defines a W3C verification
                                method
                          title: >-
                            VerificationRelationship defines a W3C verification
                            relationship
                      capability_invocations:
                        type: array
                        items:
                          type: object
                          properties:
                            verification_method_id:
                              type: string
                            verification_method:
                              type: object
                              properties:
                                id:
                                  type: string
                                type:
                                  type: string
                                controller:
                                  type: string
                                public_key_base58:
                                  type: string
                              title: >-
                                VerificationMethod defines a W3C verification
                                method
                          title: >-
                            VerificationRelationship defines a W3C verification
                            relationship
                      capability_delegations:
                        type: array
                        items:
                          type: object
                          properties:
                            verification_method_id:
                              type: string
                            verification_method:
                              type: object
                              properties:
                                id:
                                  type: string
                                type:
                                  type: string
                                controller:
                                  type: string
                                public_key_base58:
                                  type: string
                              title: >-
                                VerificationMethod defines a W3C verification
                                method
                          title: >-
                            VerificationRelationship defines a W3C verification
                            relationship
                      services:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            type:
                              type: string
                            service_endpoint:
                              type: string
                          description: Service defines a service in the W3C DID Document.
                    description: >-
                      NOTE: All 'json_name' and 'gogoproto.customtype' tags are
                      for panacea-core to

                      unmarshal the v1.3 genesis which is in the W3C JSON-LD
                      format.
                            On the other hand, the panacea-core and cosmos-sdk don't use those tags
                            to marshal result to JSON (via grpc-gateway).
                    title: DIDDocument defines a W3C DID Document
                  sequence:
                    type: string
                    format: uint64
                description: >-
                  DIDDocumentWithSeq defines a message for DID Document with a
                  sequence number

                  for preventing replay attacks.
            description: >-
              QueryDIDResponse is the response type for the
              Query/DIDDocumentWithSeq RPC

              method.
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              error:
                type: string
              code:
                type: integer
                format: int32
              message:
                type: string
              details:
                type: array
                items:
                  type: object
                  properties:
                    type_url:
                      type: string
                    value:
                      type: string
                      format: byte
      parameters:
        - name: did_base64
          description: 'NOTE: Using base64 due to the URI path cannot contain colons.'
          in: path
          required: true
          type: string
      tags:
        - Query
  /panacea/nft/v1/classes/{class_id}:
    get:
      operationId: ClassRecord
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              class_record:
                type: object
                properties:
                  class:
                    type: object
                    properties:
                      id:
                        type: string
                        title: >-
                          id defines the unique identifier of the NFT
                          classification, similar to the contract address of
                          ERC721
                      name:
                        type: string
                        title: >-
                          name defines the human-readable name of the NFT
                          classification. Optional
                      symbol:
                        type: string
                        title: >-
                          symbol is an abbreviated name for nft classification.
                          Optional
                      description:
                        type: string
                        title: >-
                          description is a brief description of nft
                          classification. Optional
                      uri:
                        type: string
                        title: >-
                          uri for the class metadata stored off chain. It can
                          define schema for Class and NFT `Data` attributes.
                          Optional
                      uri_hash:
                        type: string
                        title: >-
                          uri_hash is a hash of the document pointed by uri.
                          Optional
                      data:
                        title: >-
                          data is the app specific metadata of the NFT class.
                          Optional
                        type: object
                        properties:
                          type_url:
                            type: string
                            description: >-
                              A URL/resource name that uniquely identifies the
                              type of the serialized

                              protocol buffer message. This string must contain
                              at least

                              one "/" character. The last segment of the URL's
                              path must represent

                              the fully qualified name of the type (as in

                              `path/google.protobuf.Duration`). The name should
                              be in a canonical form

                              (e.g., leading "." is not accepted).


                              In practice, teams usually precompile into the
                              binary all types that they

                              expect it to use in the context of Any. However,
                              for URLs which use the

                              scheme `http`, `https`, or no scheme, one can
                              optionally set up a type

                              server that maps type URLs to message definitions
                              as follows:


                              * If no scheme is provided, `https` is assumed.

                              * An HTTP GET on the URL must yield a
                              [google.protobuf.Type][]
                                value in binary format, or produce an error.
                              * Applications are allowed to cache lookup results
                              based on the
                                URL, or have them precompiled into a binary to avoid any
                                lookup. Therefore, binary compatibility needs to be preserved
                                on changes to types. (Use versioned type names to manage
                                breaking changes.)

                              Note: this functionality is not currently
                              available in the official

                              protobuf release, and it is not used for type URLs
                              beginning with

                              type.googleapis.com. As of May 2023, there are no
                              widely used type server

                              implementations and no plans to implement one.


                              Schemes other than `http`, `https` (or the empty
                              scheme) might be

                              used with implementation specific semantics.
                          value:
                            type: string
                            format: byte
                            description: >-
                              Must be a valid serialized protocol buffer of the
                              above specified type.
                        description: >-
                          `Any` contains an arbitrary serialized protocol buffer
                          message along with a

                          URL that describes the type of the serialized message.


                          Protobuf library provides support to pack/unpack Any
                          values in the form

                          of utility functions or additional generated methods
                          of the Any type.


                          Example 1: Pack and unpack a message in C++.

                              Foo foo = ...;
                              Any any;
                              any.PackFrom(foo);
                              ...
                              if (any.UnpackTo(&foo)) {
                                ...
                              }

                          Example 2: Pack and unpack a message in Java.

                              Foo foo = ...;
                              Any any = Any.pack(foo);
                              ...
                              if (any.is(Foo.class)) {
                                foo = any.unpack(Foo.class);
                              }
                              // or ...
                              if (any.isSameTypeAs(Foo.getDefaultInstance())) {
                                foo = any.unpack(Foo.getDefaultInstance());
                              }

                           Example 3: Pack and unpack a message in Python.

                              foo = Foo(...)
                              any = Any()
                              any.Pack(foo)
                              ...
                              if any.Is(Foo.DESCRIPTOR):
                                any.Unpack(foo)
                                ...

                           Example 4: Pack and unpack a message in Go

                               foo := &pb.Foo{...}
                               any, err := anypb.New(foo)
                               if err != nil {
                                 ...
                               }
                               ...
                               foo := &pb.Foo{}
                               if err := any.UnmarshalTo(foo); err != nil {
                                 ...
                               }

                          The pack methods provided by protobuf library will by
                          default use

                          'type.googleapis.com/full.type.name' as the type URL
                          and the unpack

                          methods only use the fully qualified type name after
                          the last '/'

                          in the type URL, for example "foo.bar.com/x/y.z" will
                          yield type

                          name "y.z".


                          JSON

                          ====

                          The JSON representation of an `Any` value uses the
                          regular

                          representation of the deserialized, embedded message,
                          with an

                          additional field `@type` which contains the type URL.
                          Example:

                              package google.profile;
                              message Person {
                                string first_name = 1;
                                string last_name = 2;
                              }

                              {
                                "@type": "type.googleapis.com/google.profile.Person",
                                "firstName": <string>,
                                "lastName": <string>
                              }

                          If the embedded message type is well-known and has a
                          custom JSON

                          representation, that representation will be embedded
                          adding a field

                          `value` which holds the custom JSON in addition to the
                          `@type`

                          field. Example (for message
                          [google.protobuf.Duration][]):

                              {
                                "@type": "type.googleapis.com/google.protobuf.Duration",
                                "value": "1.212s"
                              }
                    description: Class defines the class of the nft type.
                  policy:
                    type: object
                    properties:
                      class_id:
                        type: string
                      creator:
                        type: string
                      controller:
                        type: string
                      transfer_policy:
                        type: string
                        enum:
                          - TRANSFER_POLICY_UNSPECIFIED
                          - TRANSFER_POLICY_LOCKED
                          - TRANSFER_POLICY_OWNER_TRANSFERABLE
                        default: TRANSFER_POLICY_UNSPECIFIED
                        description: >-
                          TransferPolicy defines whether an NFT owner may
                          transfer an NFT.
                      revocable:
                        type: boolean
                      max_supply:
                        type: string
                        format: uint64
                    description: >-
                      ClassPolicy stores Panacea policy state for one standard
                      NFT class.
                  minted_count:
                    type: string
                    format: uint64
                description: >-
                  ClassRecord combines a standard NFT class with its Panacea
                  policy state.
            description: QueryClassRecordResponse returns one class and its policy.
