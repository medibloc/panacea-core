name: Docker

on:
  push:
    # Publish semver tags as releases.
    tags: ['v*.*.*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Resolve source metadata
        id: source
        shell: bash
        run: |
          set -euo pipefail
          version=$(git describe --tags)
          version=${version#v}
          commit=$(git rev-parse HEAD)
          cmt_version=$(awk '$1 == "github.com/cometbft/cometbft" { if ($2 == "=>") version = $4; else version = $2 } END { print version }' go.mod)
          test -n "$version"
          test -n "$commit"
          test -n "$cmt_version"
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >>"$GITHUB_OUTPUT"
          printf 'cmt_version=%s\n' "$cmt_version" >>"$GITHUB_OUTPUT"

      - name: Set up Go from go.mod
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Materialize verified release dependencies
        shell: bash
        run: |
          set -euo pipefail
          go mod verify
          go mod vendor -o .local/docker-release-vendor

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          build-contexts: |
            panacea_vendor=.local/docker-release-vendor
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          build-args: |
            PANACEA_VERSION=${{ steps.source.outputs.version }}
            PANACEA_COMMIT=${{ steps.source.outputs.commit }}
            PANACEA_CMT_VERSION=${{ steps.source.outputs.cmt_version }}
