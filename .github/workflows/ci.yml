name: ci

on:
  push:
    branches:    # only for pushes on master
    - develop
    - main
    - release/v*.*.*
  pull_request:  # for all PRs regardless of its base branch

jobs:

  build:
    name: Build and Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        fetch-depth: 0

    - name: Set up Go from go.mod
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: |
          go.sum
          e2e/go.sum
      id: go

    - name: Check protobuf generation
      run: make proto-check-generated

    - name: Check protobuf compatibility
      run: make proto-check-breaking

    - name: Test upgrade rehearsal safety rails
      run: ./scripts/upgrade-local/run-test.sh

    - name: Build (+ generating proto and docs)
      run: make all

    - name: Test
      run: make test

    - name: Test e2e module
      working-directory: e2e
      run: go test ./...

    - name: Lint
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.12.2

    - name: Publish coverage.html as an artifact
      uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
      with:
        name: coverage
        path: artifacts/coverage.html
