syntax = "proto3";
package panacea.nft.v1;

import "cosmos_proto/cosmos.proto";

option go_package = "github.com/medibloc/panacea-core/v2/x/nft/types";
option java_multiple_files = true;

// EventClassCreated is emitted when a class is created.
message EventClassCreated {
  string class_id = 1;
  string creator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// EventControllerUpdated is emitted when class control changes.
message EventControllerUpdated {
  string class_id = 1;
  string old_controller = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string new_controller = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// EventNFTRevoked is emitted when an NFT is irreversibly revoked.
message EventNFTRevoked {
  string class_id = 1;
  string nft_id = 2;
  string controller = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
