syntax = "proto3";
package panacea.nft.v1;

import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "google/protobuf/any.proto";
import "panacea/nft/v1/nft.proto";

option go_package = "github.com/medibloc/panacea-core/v2/x/nft/types";
option java_multiple_files = true;

// Msg defines the Panacea NFT transaction service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc CreateClass(MsgCreateClassRequest) returns (MsgCreateClassResponse);
  rpc UpdateController(MsgUpdateControllerRequest) returns (MsgUpdateControllerResponse);
  rpc Mint(MsgMintRequest) returns (MsgMintResponse);
  rpc Revoke(MsgRevokeRequest) returns (MsgRevokeResponse);
  rpc Burn(MsgBurnRequest) returns (MsgBurnResponse);
}

// MsgCreateClassRequest creates an immutable class and its policy.
message MsgCreateClassRequest {
  option (cosmos.msg.v1.signer) = "creator";

  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string local_class_id = 2;
  string name = 3;
  string symbol = 4;
  string description = 5;
  string uri = 6;
  string uri_hash = 7;
  TransferPolicy transfer_policy = 8;
  bool revocable = 9;
  uint64 max_supply = 10;
}

// MsgCreateClassResponse returns the chain-generated full class ID.
message MsgCreateClassResponse {
  string class_id = 1;
}

// MsgUpdateControllerRequest transfers class operations to a new controller.
message MsgUpdateControllerRequest {
  option (cosmos.msg.v1.signer) = "controller";

  string class_id = 1;
  string controller = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string new_controller = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgUpdateControllerResponse is the response for UpdateController.
message MsgUpdateControllerResponse {}

// MsgMintRequest mints one NFT to a recipient.
message MsgMintRequest {
  option (cosmos.msg.v1.signer) = "controller";

  string class_id = 1;
  string nft_id = 2;
  string controller = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string recipient = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string uri = 5;
  string uri_hash = 6;
  google.protobuf.Any data = 7;
}

// MsgMintResponse is the response for Mint.
message MsgMintResponse {}

// MsgRevokeRequest irreversibly revokes one live NFT.
message MsgRevokeRequest {
  option (cosmos.msg.v1.signer) = "controller";

  string class_id = 1;
  string nft_id = 2;
  string controller = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgRevokeResponse is the response for Revoke.
message MsgRevokeResponse {}

// MsgBurnRequest permanently burns an NFT owned by the signer.
message MsgBurnRequest {
  option (cosmos.msg.v1.signer) = "owner";

  string class_id = 1;
  string nft_id = 2;
  string owner = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

// MsgBurnResponse is the response for Burn.
message MsgBurnResponse {}
