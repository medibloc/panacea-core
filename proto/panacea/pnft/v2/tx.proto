syntax = "proto3";
package panacea.pnft.v2;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";

option go_package = "github.com/medibloc/panacea-core/v2/x/pnft/types";
option java_multiple_files = true;

// Msg is retained only for wire compatibility with legacy PNFT transactions
// and messages embedded in historical gov, group, and authz Any values.
// PNFT execution is disabled; new integrations must use panacea.nft.v1.Msg.
service Msg {
  option (cosmos.msg.v1.service) = true;

  rpc CreateDenom(MsgCreateDenomRequest) returns (MsgCreateDenomResponse);

  rpc UpdateDenom(MsgUpdateDenomRequest) returns (MsgUpdateDenomResponse);

  rpc DeleteDenom(MsgDeleteDenomRequest) returns (MsgDeleteDenomResponse);

  rpc TransferDenom(MsgTransferDenomRequest) returns (MsgTransferDenomResponse);

  rpc MintPNFT(MsgMintPNFTRequest) returns (MsgMintPNFTResponse);

  rpc TransferPNFT(MsgTransferPNFTRequest) returns (MsgTransferPNFTResponse);

  rpc BurnPNFT(MsgBurnPNFTRequest) returns (MsgBurnPNFTResponse);
}

message MsgCreateDenomRequest {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "pnft/CreateDenom";

  string id = 1;
  string name = 2;
  string symbol = 3;
  string description = 4;
  string uri = 5;
  string uri_hash = 6;
  string data = 7;
  string creator = 8 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgCreateDenomResponse {}

message MsgUpdateDenomRequest {
  option (cosmos.msg.v1.signer) = "updater";
  option (amino.name) = "pnft/UpdateDenom";

  string id = 1;
  string name = 2;
  string symbol = 3;
  string description = 4;
  string uri = 5;
  string uri_hash = 6;
  string data = 7;
  string updater = 8 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgUpdateDenomResponse {}

message MsgDeleteDenomRequest {
  option (cosmos.msg.v1.signer) = "remover";
  option (amino.name) = "pnft/DeleteDenom";

  string id = 1;
  string remover = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgDeleteDenomResponse {}

message MsgTransferDenomRequest {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "pnft/TransferDenom";

  string id = 1;
  string sender = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string receiver = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgTransferDenomResponse {}

message MsgMintPNFTRequest {
  option (cosmos.msg.v1.signer) = "creator";
  option (amino.name) = "pnft/MintPNFT";

  string denom_id = 1;
  string id = 2;
  string name = 3;
  string description = 4;
  string uri = 5;
  string uri_hash = 6;
  string data = 7;
  string creator = 8 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgMintPNFTResponse {}

message MsgTransferPNFTRequest {
  option (cosmos.msg.v1.signer) = "sender";
  option (amino.name) = "pnft/TransferPNFT";

  string denom_id = 1;
  string id = 2;
  string sender = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string receiver = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgTransferPNFTResponse {}

message MsgBurnPNFTRequest {
  option (cosmos.msg.v1.signer) = "burner";
  option (amino.name) = "pnft/BurnPNFT";

  string denom_id = 1;
  string id = 2;
  string burner = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgBurnPNFTResponse {}
